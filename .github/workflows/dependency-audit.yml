name: Dependency security audit

# Read-only diagnostic: no Cloudflare credentials, deployment, or dependency fixes.
on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/audit-dependencies.mjs"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Temporary candidate generation on this PR only. Do not commit from Actions.
      - name: Generate candidate patched lockfile metadata
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const fs=require("fs"),cp=require("child_process");const old=JSON.parse(cp.execFileSync("git",["show","HEAD:package-lock.json"],{encoding:"utf8"}));const now=JSON.parse(fs.readFileSync("package-lock.json","utf8"));const change={};for(const [key,item] of Object.entries(now.packages)){if(JSON.stringify(old.packages[key])!==JSON.stringify(item))change[key]=item;}console.log("LOCK_PATCH_JSON_START"+JSON.stringify(change)+"LOCK_PATCH_JSON_END");'
      - run: npm ci --ignore-scripts
      - name: Classify all and production dependency advisories
        run: node scripts/audit-dependencies.mjs
      - name: Retain advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit-report.json
          if-no-files-found: ignore
