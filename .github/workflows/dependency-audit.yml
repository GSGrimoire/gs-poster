name: Dependency security audit

# Read-only diagnostic: no Cloudflare credentials, deployment, or dependency fixes.
on:
  workflow_dispatch:
  schedule:
    - cron: "20 3 * * 1"
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "package-lock.json"
      - "scripts/audit-dependencies.mjs"
      - ".github/workflows/dependency-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Classify all and production dependency advisories
        run: node scripts/audit-dependencies.mjs
      - name: Retain advisory evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: audit-report.json
          if-no-files-found: ignore
