name: Deploy

# Every push to main is checked, then deployed to Cloudflare.
# The deploy job uses the "production" environment: add yourself as a
# required reviewer there and each deploy waits for your click.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx wrangler deploy --dry-run --outdir dist

  deploy:
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.prep.outputs.url }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Prepare Cloudflare resources
        id: prep
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/prepare-deploy.mjs

      - name: Deploy Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.prep.outputs.account_id }}
        run: npx wrangler deploy --config wrangler.generated.jsonc

      - name: Create the cookie secret on first deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ steps.prep.outputs.account_id }}
        run: |
          if npx wrangler secret list --config wrangler.generated.jsonc | grep -q '"COOKIE_SECRET"'; then
            echo "COOKIE_SECRET already set"
          else
            openssl rand -hex 32 | npx wrangler secret put COOKIE_SECRET --config wrangler.generated.jsonc
            echo "COOKIE_SECRET created"
          fi

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "- Approval site: ${{ steps.prep.outputs.url }}"
            echo "- MCP server (add as a custom connector in Claude): ${{ steps.prep.outputs.url }}/mcp"
            echo "- GitHub OAuth app callback URL: ${{ steps.prep.outputs.url }}/callback"
          } >> "$GITHUB_STEP_SUMMARY"
